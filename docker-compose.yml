version: '3.9'

services:
  php_crypto:
    image: spellsmell/cryptopro:latest
    restart: always
    build:
      context: ./php
      network: host
#    environment:
#      XDEBUG_CONFIG: "client_host=${DEV_HOST_IP} client_port=${XDEBUG_PORT}"
#      PHP_IDE_CONFIG: "serverName=cryptopro"
    networks:
      spellsmell:
        ipv4_address: 172.145.0.2

    volumes:
      - ./www/:/www
      - ./keys/:/keys
networks:
  spellsmell:
    ipam:
      config:
        - subnet: 172.145.0.0/16
